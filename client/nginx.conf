server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite filenames are content-hashed. Cache real assets permanently, but
    # never fall back to index.html for a missing old hash during a rolling
    # deployment; JavaScript requests must receive a real 404.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The application shell must always be revalidated so a browser does not
    # keep loading an old bundle (for example the polling-first Socket.IO
    # client) after a new frontend image has been deployed.
    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /api/ {
        # 'backend-service' ki jagah apni Backend K8s Service ka actual naam likhein
        proxy_pass http://backend-svc:4000/api/; 
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # File upload size limit - 50MB
        client_max_body_size 50M;
    }

    # Socket.IO must be proxied separately from /api. Without this block,
    # requests to /socket.io are handled by the SPA fallback above and the
    # browser repeatedly reports a failed WebSocket connection.
    location /socket.io/ {
        proxy_pass http://backend-svc:4000/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
